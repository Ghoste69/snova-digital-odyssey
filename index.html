</style></head><body><h2>S-NOVA</h2> DIGITAL ODYSSEY // CORE AWAKENING<div id="stats"></div><canvas id="arena" width="360" height="320"></canvas><div style="font-size:11px"><span style="color:#ff70db">◆ Power</span> · <span style="color:#6affbd">◆ Speed</span> · <span style="color:#ffd65c">● Coin</span> · <span style="color:#ff3344">◆ Mine</span></div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="slide">SLIDE</button><button id="focus">FOCUS</button><button id="combo" class="wide">SLIDE + FOCUS</button><button id="mode" class="wide">COMBO: HOLD</button><button id="charge" class="wide">NOVA CHARGE</button><button id="auto" class="wide">AUTO FIRE: ON</button><button id="fire" class="wide" hidden>FIRE</button></div></div><button id="restart">Restart Mission</button><div id="records"></div><footer>Prototype v0.06 — Core Awakening</footer><script>

$("auto").onclick=()=>{auto=!auto;$("auto").textContent="AUTO FIRE: "+(auto?"ON":"OFF");$("fire").hidden=auto};$("restart").onclick=reset;
function startCharge(){if(state==="play"&&!charging){charging=true;charge=0;$("charge").classList.add("active")}}

$("charge").onpointerdown=e=>{e.preventDefault();if(charging)return;$("charge").setPointerCapture(e.pointerId);startCharge()};$("charge").onpointerup=release;$("charge").onpointercancel=$("charge").onlostpointercapture=cancelCharge;
window.onkeydown=e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key==="e"&&!e.repeat)startCharge()};window.onkeyup=e=>{keys.delete(e.key);if(e.key==="e")release()};window.onblur=clear;document.addEventListener("visibilitychange",()=>{if(document.hidden){clear();last=0}});
function spawn(type){let [h,s,r,c,range,interval]=T[type],x,y,n=0;do{let side=Math.random()*4|0;x=side===0?32:side===1?328:32+Math.random()*296;y=side===2?32:side===3?288:32+Math.random()*256}while(Math.hypot(x-p.x,y-p.y)<140&&++n<30);E.push({type,x,y,h,max:h,s,r,c,range,interval,cd:.7+Math.random(),angle:0})}

function shoot(a,t,v,own,off=0,c=null,d=10,r=3){let z=Math.atan2(t.y-a.y,t.x-a.x)+off;B.push({x:a.x,y:a.y,vx:Math.cos(z)*v,vy:Math.sin(z)*v,own,c:c||(own?"#d5b0ff":"#ffb353"),d,r})}
function drop(e){let r=Math.random(),type=r<.15?"power":r<.30?"speed":r<.55?"coin":r<.65?"mine":null;if(type)I.push({x:e.x,y:e.y,type,life:type==="mine"?7:15,fuse:null})}
function enemy(e,dt){let x=p.x-e.x,y=p.y-e.y,d=Math.hypot(x,y)||1;e.angle=Math.atan2(y,x);e.cd-=dt;let dir=0;if(e.type==="hunter"){dir=d>20?1:0;if(d<24&&e.cd<=0){hp=Math.max(0,hp-10);e.cd=e.interval}}else{dir=d>e.range+20?1:d<e.range-30&&e.type!=="sentinel"?-1:0;if(e.cd<=0){let offsets=e.type==="boss"?[-.55,-.27,0,.27,.55]:e.type==="artillery"?[-.28,0,.28]:[0];for(let o of offsets)shoot(e,p,e.type==="artillery"?105:125,false,o,e.c,e.type==="boss"?12:10,4);e.cd=e.interval}}e.x+=x/d*e.s*dt*dir;e.y+=y/d*e.s*dt*dir;for(let a of E){if(a===e)continue;let x=e.x-a.x,y=e.y-a.y,d=Math.hypot(x,y)||.01,m=e.r+a.r+4;if(d<m){e.x+=x/d*(m-d)*.35;e.y+=y/d*(m-d)*.35}}e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r,H-e.r)}
function orb(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function ring(x,y,r,c){g.strokeStyle=c;g.lineWidth=1;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.stroke()}
function diamond(x,y,r,c){g.fillStyle=c;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y);g.lineTo(x,y+r);g.lineTo(x-r,y);g.closePath();g.fill()}
function frame(now){let dt=last?Math.min(.04,(now-last)/1000):0;last=now;let slide=state==="play"&&!locked&&(combo||held.slide.size||keys.has("Shift")),focus=state==="play"&&!locked&&(combo||held.focus.size||keys.has("q")),slow=focus?.25:1;
if(state==="play"&&!document.hidden){elapsed+=dt;let x=jx+Number(keys.has("d")||keys.has("ArrowRight"))-Number(keys.has("a")||keys.has("ArrowLeft")),y=jy+Number(keys.has("s")||keys.has("ArrowDown"))-Number(keys.has("w")||keys.has("ArrowUp")),l=Math.hypot(x,y);if(l){dx=x/l;dy=y/l}if(l||slide){let v=(slide?270:100*Math.min(1,l))*(1+.08*speed);p.x+=dx*dt*v;p.y+=dy*dt*v}p.x=clamp(p.x,12,348);p.y=clamp(p.y,12,308);heat=clamp(heat+dt*((slide?32:0)+(focus?24:0)-(!slide&&!focus?26:0)),0,100);if(heat>=100){locked=true;combo=false;sync()}if(heat<30)locked=false;
delay-=dt;if(charging)charge=Math.min(2,charge+dt);let t=target();if(t&&!charging&&(auto||held.fire.size||keys.has(" "))&&delay<=0){shoot(p,t,300,true,0,null,10+power*2);delay=.2}
for(let e of E)enemy(e,dt*slow);for(let b of B){let t=dt*(b.own?1:slow);b.x+=b.vx*t;b.y+=b.vy*t;if(b.own){for(let e of E){if(e.h>0&&dist(b,e)<e.r+b.r){e.h-=b.d;b.dead=true;break}}}else if(dist(b,p)<10+b.r){hp=Math.max(0,hp-b.d);b.dead=true}}B=B.filter(b=>!b.dead&&b.x>0&&b.x<W&&b.y>0&&b.y<H);
let defeated=false;for(let e of E){if(e.h<=0){kills++;score+=e.type==="boss"?500:50;if(e.type==="boss")defeated=true;else drop(e)}}E=E.filter(e=>e.h>0);
for(let i of I){i.life-=dt;let d=dist(i,p);if(i.type==="mine"){if(i.fuse===null&&i.life>0&&d<32)i.fuse=.5;if(i.fuse!==null){i.fuse-=dt;if(i.fuse<=0){if(d<48)hp=Math.max(0,hp-15);F.push({x:i.x,y:i.y,life:.4});i.dead=true}}}else if(i.life>0&&d<23){if(i.type==="power"){if(power<5)power++;else score+=50}else if(i.type==="speed"){if(speed<5)speed++;else score+=50}else score+=100;i.dead=true}}
I=I.filter(i=>!i.dead&&(i.life>0||i.fuse!==null));F=F.filter(f=>(f.life-=dt)>0);
if(hp<=0)finish(false);else if(defeated)finish(true);else if(kills>=50){if(!E.length&&!boss){boss=true;B=[];spawn("boss")}}else{wave=kills>=15?3:kills>=5?2:1;while(E.length<Math.min(wave,50-kills))spawn(next())}}
g.fillStyle=focus?"#24204b":"#17112b";g.fillRect(0,0,W,H);g.strokeStyle="#35264e";g.lineWidth=.6;for(let x=0;x<W;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
for(let i of I){if(i.type==="mine"){ring(i.x,i.y,i.fuse===null?32:48,"#ff3344");diamond(i.x,i.y,8,Math.sin(now/80)>0?"#ff3344":"#81152b")}else if(i.type==="coin")orb(i.x,i.y,7,"#ffd65c");else diamond(i.x,i.y,8,i.type==="power"?"#ff70db":"#6affbd")}
for(let f of F)ring(f.x,f.y,48,"#ff7766");if(slide)for(let i=5;i>0;i--)orb(p.x-dx*i*9,p.y-dy*i*9,9,"rgba(155,90,255,.25)");orb(p.x,p.y,11,"#a76bff");orb(p.x,p.y,5,"#f2d9ff");if(charging)ring(p.x,p.y,15+charge*5,"#eee0ff");
for(let e of E){if(e.type==="artillery"){g.fillStyle=e.c;g.fillRect(e.x-15,e.y-15,30,30)}else if(e.type==="hunter"){g.save();g.translate(e.x,e.y);g.rotate(e.angle);g.fillStyle=e.c;g.beginPath();g.moveTo(15,0);g.lineTo(-10,-10);g.lineTo(-10,10);g.closePath();g.fill();g.restore()}else{orb(e.x,e.y,e.r,e.c);orb(e.x,e.y,e.r*.45,"#72213d")}g.fillStyle="#35264e";g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);g.fillStyle=e.c;g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.h)/e.max,4)}
let t=target();if(t&&state==="play"&&(auto||charging||held.fire.size))ring(t.x,t.y,t.r+6,"#d2afff");for(let b of B)orb(b.x,b.y,b.r,b.c);g.fillStyle="#3d2d55";g.fillRect(10,305,100,5);g.fillStyle=locked?"#ff536b":"#b78aff";g.fillRect(10,305,heat,5);g.fillStyle="#d9baff";g.font="12px system-ui";g.textAlign="right";g.fillText(boss?"CORE GUARDIAN":kills>=50?"CLEAR REMAINING":"WAVE "+wave,350,15);
$("charge").textContent=charging?"CHARGE "+Math.round(charge*50)+"%":"NOVA CHARGE";$("stats").textContent=`HP ${hp} | HEAT ${Math.round(heat)}% | KILLS ${kills} | ${time(elapsed)} | SCORE ${score} | POWER ${power}/5 | SPEED ${speed}/5`+(locked?" | OVERHEATED":"");
if(state!=="play"){g.fillStyle="rgba(10,5,20,.85)";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.textAlign="center";g.font="bold 24px system-ui";g.fillText(state==="won"?"MISSION COMPLETE":"SIGNAL LOST",180,120);g.font="16px system-ui";g.fillText(`Kills ${kills} | HP ${hp} | ${time(elapsed)}`,180,155);g.fillText("Score "+score,180,180);g.fillText("Restart mission to retry",180,210)}requestAnimationFrame(frame)}
