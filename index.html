<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-Nova: Digital Odyssey</title>
<style>
* {
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
html,body {
  touch-action:none;
  overscroll-behavior:none;
}
body {
  margin:0;
  background:#090615;
  color:white;
  font-family:system-ui;
  text-align:center;
}
h2 {
  color:#bc8cff;
  letter-spacing:3px;
}
canvas {
  width:100%;
  max-width:600px;
  background:#17112b;
  border:1px solid #7950bd;
  border-radius:10px;
  touch-action:none;
}
#controls {
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:600px;
  margin:12px auto;
  padding:8px;
  gap:12px;
}
#stick {
  width:132px;
  height:132px;
  flex-shrink:0;
  border-radius:50%;
  background:#24163e;
  border:2px solid #7950bd;
  position:relative;
  touch-action:none;
}
#knob {
  position:absolute;
  left:calc(50% - 23px);
  top:calc(50% - 23px);
  width:46px;
  height:46px;
  border-radius:50%;
  background:#a76bff;
  pointer-events:none;
}
.actions {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}
button {
  background:#382354;
  color:white;
  border:1px solid #9565db;
  border-radius:10px;
  padding:10px;
  min-height:44px;
  font-weight:bold;
  touch-action:none;
}
button:active,button.active {
  background:#a267ff;
}
button[aria-pressed="true"] {
  background:#7950bd;
}
#stats {
  padding:12px;
  color:#d9baff;
}
.legend {
  font-size:11px;
  color:#aaa;
  margin:6px;
}
</style>
</head>
<body>

<h2>S-NOVA</h2>
<div>DIGITAL ODYSSEY // NOVA DRIVE</div>
<div id="stats"></div>

<canvas id="arena" width="360" height="320"></canvas>

<div class="legend">
  <span style="color:#ff486d">● Sentinel</span>
  &nbsp;
  <span style="color:#ff9d42">▲ Hunter</span>
  &nbsp;
  <span style="color:#4bcde8">■ Artillery</span>
</div>

<div id="controls">
  <div id="stick">
    <div id="knob"></div>
  </div>

  <div class="actions">
    <button data-key="slide">SLIDE</button>
    <button data-key="focus">FOCUS</button>

    <button id="combo" style="grid-column:span 2">
      SLIDE + FOCUS
    </button>

    <button id="mode" style="grid-column:span 2">
      COMBO MODE: HOLD
    </button>

    <button id="auto" aria-pressed="true"
      style="grid-column:span 2">
      AUTO FIRE: ON
    </button>

    <button data-key="fire" id="manual"
      style="grid-column:span 2;display:none">
      FIRE
    </button>
  </div>
</div>

<button id="restart">Restart Mission</button>
<p>Prototype v0.05 — Enemy Waves</p>

<script>
const c=document.getElementById("arena");
const g=c.getContext("2d");
const stats=document.getElementById("stats");
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
const autoButton=document.getElementById("auto");
const comboButton=document.getElementById("combo");
const modeButton=document.getElementById("mode");
const manual=document.getElementById("manual");

const keys={};
const actionPointers=new Map();

let auto=true;
let toggleMode=false;
let comboOn=false;
let comboPointer=null;
let jx=0,jy=0,stickId=null;

let p,enemies,bullets,hp,heat,kills,locked;
let fireDelay,dx,dy,last=0;
let wave=1;

const TYPES={
  sentinel:{
    hp:100,
    speed:38,
    radius:15,
    color:"#ff486d",
    range:65,
    interval:.85
  },
  hunter:{
    hp:60,
    speed:105,
    radius:11,
    color:"#ff9d42",
    range:0,
    interval:.8
  },
  artillery:{
    hp:120,
    speed:24,
    radius:16,
    color:"#4bcde8",
    range:145,
    interval:2.2
  }
};

document.addEventListener("contextmenu",
  ev=>ev.preventDefault());

document.addEventListener("selectstart",
  ev=>ev.preventDefault());

document.addEventListener("touchmove",
  ev=>ev.preventDefault(),{passive:false});

function moveStick(ev){
  const b=stick.getBoundingClientRect();
  let x=ev.clientX-b.left-b.width/2;
  let y=ev.clientY-b.top-b.height/2;
  const d=Math.hypot(x,y);
  const m=Math.min(1,d/42);

  jx=d>5?x/d*m:0;
  jy=d>5?y/d*m:0;

  knob.style.transform=
    `translate(${jx*42}px,${jy*42}px)`;
}

function clearStick(){
  stickId=null;
  jx=jy=0;
  knob.style.transform="";
}

stick.onpointerdown=ev=>{
  ev.preventDefault();
  if(stickId!==null)return;

  stickId=ev.pointerId;
  stick.setPointerCapture(ev.pointerId);
  moveStick(ev);
};

stick.onpointermove=ev=>{
  if(ev.pointerId===stickId)moveStick(ev);
};

stick.onpointerup=
stick.onpointercancel=
stick.onlostpointercapture=ev=>{
  if(ev.pointerId===stickId)clearStick();
};

autoButton.onclick=()=>{
  auto=!auto;

  autoButton.textContent=
    "AUTO FIRE: "+(auto?"ON":"OFF");

  autoButton.setAttribute(
    "aria-pressed",String(auto));

  manual.style.display=auto?"none":"block";
};

function syncCombo(){
  comboButton.classList.toggle("active",comboOn);

  comboButton.setAttribute(
    "aria-pressed",String(comboOn));

  comboButton.textContent=toggleMode
    ?"SLIDE + FOCUS: "+(comboOn?"ON":"OFF")
    :"SLIDE + FOCUS";

  modeButton.textContent=
    "COMBO MODE: "+(toggleMode?"TOGGLE":"HOLD");
}

function stopCombo(){
  comboOn=false;
  comboPointer=null;
  syncCombo();
}

modeButton.onclick=()=>{
  toggleMode=!toggleMode;
  stopCombo();
};

comboButton.onpointerdown=ev=>{
  ev.preventDefault();

  if(locked||hp<=0)return;
  if(comboPointer!==null)return;

  comboPointer=ev.pointerId;
  comboButton.setPointerCapture(ev.pointerId);

  comboOn=toggleMode?!comboOn:true;
  syncCombo();
};

comboButton.onpointerup=
comboButton.onlostpointercapture=ev=>{
  if(ev.pointerId!==comboPointer)return;

  comboPointer=null;

  if(!toggleMode)stopCombo();
};

comboButton.onpointercancel=ev=>{
  if(ev.pointerId===comboPointer)stopCombo();
};

document.querySelectorAll("[data-key]").forEach(b=>{
  const k=b.dataset.key;
  const pointers=new Set();

  actionPointers.set(k,pointers);

  b.onpointerdown=ev=>{
    ev.preventDefault();
    b.setPointerCapture(ev.pointerId);
    pointers.add(ev.pointerId);
    b.classList.add("active");
  };

  b.onpointerup=
  b.onpointercancel=
  b.onlostpointercapture=ev=>{
    pointers.delete(ev.pointerId);
    b.classList.toggle("active",pointers.size>0);
  };
});

function held(k){
  return !!keys[k]||
    (actionPointers.get(k)?.size||0)>0;
}

function clearInputs(){
  Object.keys(keys).forEach(k=>keys[k]=false);
  actionPointers.forEach(set=>set.clear());

  clearStick();
  stopCombo();

  document.querySelectorAll(".active").forEach(b=>{
    b.classList.remove("active");
  });
}

function spawn(type){
  const t=TYPES[type];

  let x,y;
  let attempts=0;

  do{
    const side=Math.floor(Math.random()*4);

    x=side===0?20:
      side===1?340:20+Math.random()*320;

    y=side===2?20:
      side===3?300:20+Math.random()*280;

    attempts++;

  }while(Math.hypot(x-p.x,y-p.y)<140
    &&attempts<30);

  enemies.push({
    type,
    x,y,
    hp:t.hp,
    maxHp:t.hp,
    speed:t.speed,
    radius:t.radius,
    color:t.color,
    range:t.range,
    interval:t.interval,
    cooldown:.7+Math.random(),
    angle:0
  });
}

function nextType(){
  const r=Math.random();

  if(kills<2)return "sentinel";

  if(kills<5){
    return r<.6?"sentinel":"hunter";
  }

  if(r<.4)return "sentinel";
  if(r<.75)return "hunter";
  return "artillery";
}

function reset(){
  p={x:65,y:160};
  enemies=[];
  bullets=[];
  hp=100;
  heat=0;
  kills=0;
  wave=1;
  locked=false;
  fireDelay=0;
  dx=1;
  dy=0;

  clearInputs();
  spawn("sentinel");
}

reset();

document.getElementById("restart").onclick=reset;

const map={
  w:"up",a:"left",s:"down",d:"right",
  ArrowUp:"up",ArrowDown:"down",
  ArrowLeft:"left",ArrowRight:"right",
  Shift:"slide",q:"focus"," ":"fire"
};

window.addEventListener("keydown",ev=>{
  if(map[ev.key]){
    ev.preventDefault();
    keys[map[ev.key]]=true;
  }
});

window.addEventListener("keyup",ev=>{
  if(map[ev.key])keys[map[ev.key]]=false;
});

window.addEventListener("blur",clearInputs);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)clearInputs();
});

function orb(x,y,r,color){
  g.fillStyle=color;
  g.beginPath();
  g.arc(x,y,r,0,Math.PI*2);
  g.fill();
}

function shoot(a,t,v,own,offset=0,color=null){
  const angle=Math.atan2(t.y-a.y,t.x-a.x)+offset;

  bullets.push({
    x:a.x,
    y:a.y,
    vx:Math.cos(angle)*v,
    vy:Math.sin(angle)*v,
    own,
    color:color||(own?"#d5b0ff":"#ffb353")
  });
}

function nearestEnemy(){
  let target=null;
  let distance=Infinity;

  for(const e of enemies){
    if(e.hp<=0)continue;

    const d=Math.hypot(p.x-e.x,p.y-e.y);

    if(d<distance){
      distance=d;
      target=e;
    }
  }

  return target;
}

function updateEnemy(e,dt,slow){
  const t=dt*slow;
  const x=p.x-e.x;
  const y=p.y-e.y;
  const d=Math.hypot(x,y)||1;

  e.angle=Math.atan2(y,x);
  e.cooldown-=t;

  let direction=0;

  if(e.type==="hunter"){
    if(d>20)direction=1;

    if(d<24&&e.cooldown<=0){
      hp=Math.max(0,hp-10);
      e.cooldown=e.interval;
    }

  }else if(e.type==="artillery"){
    if(d>165)direction=1;
    if(d<115)direction=-1;

    if(e.cooldown<=0){
      for(const offset of [-.28,0,.28]){
        shoot(e,p,105,false,offset,"#4bcde8");
      }

      e.cooldown=e.interval;
    }

  }else{
    if(d>e.range)direction=1;

    if(e.cooldown<=0){
      shoot(e,p,125,false);
      e.cooldown=e.interval;
    }
  }

  e.x+=x/d*e.speed*t*direction;
  e.y+=y/d*e.speed*t*direction;

  for(const other of enemies){
    if(other===e)continue;

    const sx=e.x-other.x;
    const sy=e.y-other.y;
    const sd=Math.hypot(sx,sy)||.01;
    const min=e.radius+other.radius+4;

    if(sd<min){
      e.x+=sx/sd*(min-sd)*.35;
      e.y+=sy/sd*(min-sd)*.35;
    }
  }

  e.x=Math.max(e.radius,
    Math.min(360-e.radius,e.x));

  e.y=Math.max(e.radius,
    Math.min(320-e.radius,e.y));
}

function drawEnemy(e){
  g.save();
  g.translate(e.x,e.y);

  g.fillStyle=e.color;

  if(e.type==="hunter"){
    g.rotate(e.angle);
    g.beginPath();
    g.moveTo(15,0);
    g.lineTo(-10,-10);
    g.lineTo(-5,0);
    g.lineTo(-10,10);
    g.closePath();
    g.fill();

  }else if(e.type==="artillery"){
    g.fillRect(-15,-15,30,30);
    g.fillStyle="#19566b";
    g.fillRect(-8,-8,16,16);

  }else{
    orb(0,0,15,e.color);
    orb(0,0,7,"#72213d");
  }

  g.restore();

  g.fillStyle="#35264e";
  g.fillRect(e.x-15,e.y-e.radius-8,30,3);

  g.fillStyle=e.color;
  g.fillRect(e.x-15,e.y-e.radius-8,
    30*Math.max(0,e.hp)/e.maxHp,3);
}

function frame(now){
  let dt=Math.min(.04,(now-last)/1000||0);
  last=now;

  let slide=hp>0&&
    (held("slide")||comboOn)&&!locked;

  let focus=hp>0&&
    (held("focus")||comboOn)&&!locked;

  let slow=focus?.25:1;

  if(hp>0){
    let x=jx+Number(held("right"))
      -Number(held("left"));

    let y=jy+Number(held("down"))
      -Number(held("up"));

    let l=Math.hypot(x,y);

    if(l){
      dx=x/l;
      dy=y/l;
    }

    if(l||slide){
      let speed=slide?270:100*Math.min(1,l);
      p.x+=dx*dt*speed;
      p.y+=dy*dt*speed;
    }

    p.x=Math.max(12,Math.min(348,p.x));
    p.y=Math.max(12,Math.min(308,p.y));

    heat=Math.max(0,Math.min(100,
      heat+dt*((slide?32:0)+(focus?24:0)
      -(!slide&&!focus?26:0))
    ));

    if(heat>=100){
      locked=true;
      stopCombo();
    }

    if(heat<30)locked=false;

    fireDelay-=dt;

    const target=nearestEnemy();

    if(target&&(auto||held("fire"))
      &&fireDelay<=0){

      shoot(p,target,300,true);
      fireDelay=.2;
    }

    for(const e of enemies){
      updateEnemy(e,dt,slow);
    }

    for(const b of bullets){
      let t=dt*(b.own?1:slow);

      b.x+=b.vx*t;
      b.y+=b.vy*t;

      if(b.own){
        for(const e of enemies){
          if(e.hp<=0)continue;

          if(Math.hypot(b.x-e.x,b.y-e.y)
            <e.radius+2){

            e.hp-=10;
            b.dead=true;
            break;
          }
        }

      }else if(Math.hypot(b.x-p.x,b.y-p.y)<10){
        hp=Math.max(0,hp-10);
        b.dead=true;
      }
    }

    bullets=bullets.filter(b=>
      !b.dead&&b.x>0&&b.x<360
      &&b.y>0&&b.y<320
    );

    for(const e of enemies){
      if(e.hp<=0)kills++;
    }

    enemies=enemies.filter(e=>e.hp>0);

    wave=kills>=15?3:kills>=5?2:1;

    while(enemies.length<wave){
      spawn(nextType());
    }
  }

  g.fillStyle=focus?"#24204b":"#17112b";
  g.fillRect(0,0,360,320);

  g.strokeStyle="#35264e";
  g.lineWidth=.6;

  for(let x=0;x<360;x+=30){
    g.beginPath();
    g.moveTo(x,0);
    g.lineTo(x,320);
    g.stroke();
  }

  for(let y=0;y<320;y+=30){
    g.beginPath();
    g.moveTo(0,y);
    g.lineTo(360,y);
    g.stroke();
  }

  if(slide){
    for(let i=5;i>0;i--){
      orb(p.x-dx*i*9,p.y-dy*i*9,9,
        "rgba(155,90,255,.25)");
    }
  }

  g.shadowBlur=14;
  g.shadowColor="#ac75ff";

  orb(p.x,p.y,11,"#a76bff");
  orb(p.x,p.y,5,"#f2d9ff");

  g.shadowBlur=0;

  for(const e of enemies){
    drawEnemy(e);
  }

  const target=nearestEnemy();

  if(target&&hp>0&&(auto||held("fire"))){
    g.strokeStyle="rgba(210,175,255,.6)";
    g.lineWidth=1;

    g.beginPath();
    g.arc(target.x,target.y,
      target.radius+6,0,Math.PI*2);
    g.stroke();
  }

  for(const b of bullets){
    orb(b.x,b.y,b.own?3:4,b.color);
  }

  g.fillStyle="#3d2d55";
  g.fillRect(10,305,100,5);

  g.fillStyle=locked?"#ff536b":"#b78aff";
  g.fillRect(10,305,heat,5);

  g.fillStyle="#d9baff";
  g.font="11px system-ui";
  g.textAlign="right";
  g.fillText("WAVE "+wave,350,15);

  stats.textContent=
    `HP ${hp} | HEAT ${Math.round(heat)}% | KILLS ${kills}`
    +(locked?" | OVERHEATED":
      focus?" | HYPERFOCUS":"");

  if(hp<=0){
    if(comboOn)stopCombo();

    g.fillStyle="rgba(10,5,20,.85)";
    g.fillRect(0,0,360,320);

    g.fillStyle="white";
    g.textAlign="center";
    g.font="bold 24px system-ui";
    g.fillText("SIGNAL LOST",180,125);

    g.fillStyle="#d9baff";
    g.font="bold 18px system-ui";
    g.fillText("KILLS: "+kills,180,155);

    g.font="14px system-ui";
    g.fillText("Wave reached: "+wave,180,180);
    g.fillText("Restart mission to retry",180,210);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
